services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bridgeops
      POSTGRES_PASSWORD: bridgeops
      POSTGRES_DB: bridgeops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - azurite
    env_file:
      - .env

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - azurite
    env_file:
      - .env

volumes:
  postgres_data: